spring.application.name=kbmd

# No authentication is built in, so only listen on localhost by default.
server.address=127.0.0.1
server.port=8787
spring.web.error.include-message=always

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Folder holding the markdown files. Override with --kbmd.vault=... or KBMD_VAULT.
kbmd.vault=${user.home}/kbmd-vault
# Uploaded files land here (relative to the vault root).
kbmd.attachments-dir=attachments
